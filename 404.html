<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Torn Out · Ben Duncan</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@font-face { font-family: "Ultra"; src: url(/fonts/ultra-regular.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Yellowtail"; src: url(/fonts/yellowtail-regular.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Archivo Cond"; src: url(/fonts/archivocond-black.woff2) format("woff2"); font-weight: 900; font-display: swap; }
:root { --paper: #fffdf8; --ink: #16101a; --blue: #1739c9; --red: #e3101f; --sticker: #ffe11a; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); text-align: center; }
.k { font: 900 14px/1 "Archivo Cond", "Arial Narrow", sans-serif; letter-spacing: .2em; text-transform: uppercase; }
h1 { margin: 14px 0 6px; font: 400 clamp(80px, 22vw, 220px)/.8 "Ultra", Rockwell, Georgia, serif; color: var(--blue); }
p { margin: 0; font: 400 clamp(26px, 5vw, 40px)/1.1 "Yellowtail", cursive; color: var(--red); }
a { display: inline-block; margin-top: 28px; font: 900 13px/1 "Archivo Cond", "Arial Narrow", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); text-decoration: none; border: 2px solid var(--ink); padding: 10px 14px 9px; box-shadow: 4px 4px 0 var(--blue); background: var(--paper); }
a:hover { background: var(--sticker); }
</style>
</head>
<body>
<main>
  <div class="k">Page 404</div>
  <h1>TORN OUT</h1>
  <p>somebody got to this page before you did.</p>
  <a href="/">Back to the cover</a>
</main>
</body>
</html>
